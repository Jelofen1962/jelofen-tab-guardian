name: Release JTG Chrome / Edge CRX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jtg-crx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish versioned CRX
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read extension version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version"])')"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Invalid Chrome extension version in manifest.json: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Validate and package CRX
        shell: bash
        env:
          CRX_PRIVATE_KEY_BASE64: ${{ secrets.CRX_PRIVATE_KEY_BASE64 }}
          EXTENSION_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist "$RUNNER_TEMP/jtg-extension"

          rsync -a "$GITHUB_WORKSPACE/" "$RUNNER_TEMP/jtg-extension/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude 'windows-guard/' \
            --exclude 'README.md' \
            --exclude '.gitignore'

          python -m json.tool "$RUNNER_TEMP/jtg-extension/manifest.json" >/dev/null
          test -f "$RUNNER_TEMP/jtg-extension/background.js"
          test -f "$RUNNER_TEMP/jtg-extension/title-lock.js"
          test -f "$RUNNER_TEMP/jtg-extension/popup.html"

          MANIFEST_VERSION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$RUNNER_TEMP/jtg-extension/manifest.json")"
          test "$MANIFEST_VERSION" = "$EXTENSION_VERSION"

          if [[ -n "${CRX_PRIVATE_KEY_BASE64:-}" ]]; then
            printf '%s' "$CRX_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/jtg-signing-key.pem"
            test -s "$RUNNER_TEMP/jtg-signing-key.pem"
            google-chrome --no-sandbox --headless --disable-gpu \
              --pack-extension="$RUNNER_TEMP/jtg-extension" \
              --pack-extension-key="$RUNNER_TEMP/jtg-signing-key.pem"
          else
            echo "::warning::CRX_PRIVATE_KEY_BASE64 is not configured. Chrome will generate a temporary signing key, so the extension ID will change on the next build. Configure the secret to keep a stable extension ID."
            google-chrome --no-sandbox --headless --disable-gpu \
              --pack-extension="$RUNNER_TEMP/jtg-extension"
          fi

          CRX_FILE="JTG-Jelofens-Tab-Guardian-v${EXTENSION_VERSION}.crx"
          test -s "$RUNNER_TEMP/jtg-extension.crx"
          cp "$RUNNER_TEMP/jtg-extension.crx" "dist/$CRX_FILE"
          echo "Created dist/$CRX_FILE"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: JTG - Jelofen's Tab Guardian v${{ steps.meta.outputs.version }}
          body: |
            # JTG - Jelofen's Tab Guardian

            **Version:** v${{ steps.meta.outputs.version }}  
            **Crafted by:** Jelofen The Dev  
            **Telegram:** https://t.me/Jelofen1962  
            **Contact:** +989035361164

            This release contains the installable Chrome / Microsoft Edge CRX package only.
            The version is read directly from `manifest.json`.
          files: dist/*.crx
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
